<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeQuest - RPG Game</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pixel-fonts.css">
    <link rel="stylesheet" href="css/pixel-scene.css">
    <link rel="stylesheet" href="css/dark-fantasy.css">
</head>
<body>
    <div class="container">
        <div id="app" class="app">
            <!-- Auth Screen -->
            <div id="auth-screen" class="screen auth-screen active">
                <!-- Pixel art landscape background -->
                <div class="pixel-scene" aria-hidden="true">
                    <div class="pixel-sky"></div>
                    <div class="pixel-sun"></div>
                    <div class="pixel-cloud pixel-cloud-1"></div>
                    <div class="pixel-cloud pixel-cloud-2"></div>

                    <div class="pixel-hills">
                        <div class="pixel-hill pixel-hill-far"></div>
                        <div class="pixel-hill pixel-hill-near"></div>
                    </div>

                    <div class="pixel-village">
                        <div class="pixel-house pixel-house-left">
                            <div class="house-roof"></div>
                            <div class="house-body">
                                <div class="house-window"></div>
                                <div class="house-door"></div>
                            </div>
                        </div>

                        <div class="pixel-windmill">
                            <div class="windmill-blades"></div>
                            <div class="windmill-tower"></div>
                        </div>

                        <div class="pixel-house pixel-house-right">
                            <div class="house-roof"></div>
                            <div class="house-body">
                                <div class="house-window"></div>
                                <div class="house-door"></div>
                            </div>
                        </div>
                    </div>

                    <div class="pixel-wheat-field">
                        <div class="wheat-row"></div>
                        <div class="wheat-stalks"></div>
                        <div class="wheat-stalks wheat-stalks-2"></div>
                        <div class="path-edge path-edge-left"></div>
                        <div class="path-edge path-edge-right"></div>
                    </div>

                    <div class="pixel-path"></div>

                    <div class="pixel-walkers">
                        <div class="pixel-walker walker-1"></div>
                        <div class="pixel-walker walker-2"></div>
                        <div class="pixel-walker walker-3"></div>
                    </div>
                </div>

                <!-- Wooden sign hanging on chains -->
                <div class="sign-hanger">
                    <div class="sign-hook"></div>
                    <div class="sign-chains">
                        <div class="sign-chain sign-chain-left"></div>
                        <div class="sign-chain sign-chain-right"></div>
                    </div>

                    <div class="wood-sign auth-container">
                        <div class="wood-sign-plank-lines"></div>

                        <div class="auth-header">
                            <h1 class="game-title">LIFE QUEST</h1>
                            <p class="game-subtitle">Choose Your Destiny</p>
                        </div>

                        <!-- Welcome / Login State -->
                        <div id="login-form" class="form-container active">
                            <h2 class="form-title">Guild Gates</h2>
                            <p id="welcome-message" class="welcome-message">
                                Opening the guild gates...
                            </p>

                            <div class="form-group">
                                <!-- Hidden by default; shown by auth.js after Telegram session validation -->
                                <button type="button" id="create-character-button" class="btn btn-primary" hidden>
                                    Create Character
                                </button>
                            </div>

                            <div id="login-error" class="error-message"></div>
                        </div>

                        <!-- Register Form -->
                        <div id="register-form" class="form-container">
                            <h2 class="form-title">New Adventurer</h2>

                            <div class="form-group">
                                <label for="reg-username" class="form-label">Username</label>
                                <input
                                    type="text"
                                    id="reg-username"
                                    class="form-input pixel-input"
                                    placeholder="3-20 chars..."
                                    maxlength="20"
                                >
                                <small class="form-hint">Letters, numbers, -, _</small>
                            </div>

                            <div class="form-group">
                                <label for="reg-display-name" class="form-label">Hero Name</label>
                                <input
                                    type="text"
                                    id="reg-display-name"
                                    class="form-input pixel-input"
                                    placeholder="Your hero name..."
                                >
                            </div>

                            <div class="form-group">
                                <label for="reg-class" class="form-label">Class</label>
                                <select id="reg-class" class="form-input pixel-input" aria-label="Character class">
                                    <option value="adventurer">Adventurer</option>
                                    <option value="warrior">Warrior</option>
                                    <option value="mage">Mage</option>
                                    <option value="ranger">Ranger</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <button type="button" id="register-button" class="btn btn-success">
                                    Enter the Realm
                                </button>
                            </div>

                            <div class="form-group">
                                <button type="button" id="back-button" class="btn btn-secondary">
                                    Back
                                </button>
                            </div>

                            <div id="register-error" class="error-message"></div>
                            <div id="register-success" class="success-message"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Game Screen (after login) -->
            <div id="game-screen" class="screen game-screen">
                <div class="game-header">
                    <h1 class="game-title">LIFE QUEST</h1>
                </div>

                <div class="game-content">
                    <div class="player-panel">
                        <h2 class="panel-title">Player Info</h2>
                        <div id="player-info" class="player-info">
                            <p>Name: <span id="player-name">-</span></p>
                            <p>Level: <span id="player-level">1</span></p>
                            <p>Experience: <span id="player-exp">0</span></p>
                            <p>Coins: <span id="player-coins">0</span></p>
                        </div>
                    </div>

                    <div class="game-area">
                        <h2 class="panel-title">Game Area</h2>
                        <p class="coming-soon">Coming Soon...</p>
                    </div>

                    <div class="actions-panel">
                        <button type="button" id="logout-button" class="btn btn-secondary">
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
